<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link unavailable - Lamar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, Arial, sans-serif;
      background: #f8f5f0;
      color: #231f20;
    }

    main {
      width: min(460px, 100%);
      text-align: center;
      background: #fff;
      padding: 32px;
      border-radius: 8px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-family: "Playfair Display", serif;
      font-size: 32px;
    }

    p {
      margin: 0;
      color: #6d625d;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Link unavailable</h1>
    <p>Use a valid store link. Customer order links look like <strong>/store-name/orders</strong>, and admin links look like <strong>/store-name/admin</strong>.</p>
  </main>
</body>
</html>
