services:
  frontend:
    build:
      context: ./lamar-shein
      dockerfile: Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8181}:80"
    restart: unless-stopped

  backend:
    build:
      context: ./lamar-shein
      dockerfile: Dockerfile.backend
    environment:
      PORT: "8787"
      CORS_ORIGIN: "http://localhost:${FRONTEND_PORT:-8181}"
    expose:
      - "8787"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
