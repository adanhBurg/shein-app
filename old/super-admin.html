<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/" />
  <title>Super Admin - Lamar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #201c1d;
      --muted: #766d68;
      --line: #e9e0d8;
      --paper: #fffaf5;
      --panel: #ffffff;
      --accent: #9f4e3f;
      --green: #3d7f5a;
      --amber: #b86b2c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }

    button, input {
      font: inherit;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(30px, 4vw, 46px);
      letter-spacing: 0;
    }

    .user-line {
      margin-top: 5px;
      color: var(--muted);
      font-size: 14px;
    }

    .button {
      border: 0;
      border-radius: 7px;
      padding: 11px 15px;
      color: #fff;
      background: var(--ink);
      cursor: pointer;
      font-weight: 700;
    }

    .button.secondary {
      color: var(--ink);
      background: #eaded5;
    }

    .gate {
      min-height: 72vh;
      display: grid;
      place-items: center;
    }

    .gate-panel {
      width: min(420px, 100%);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 60px rgba(35, 31, 32, 0.08);
      text-align: center;
    }

    .gate-panel h2 {
      margin: 0 0 10px;
      font-family: "Playfair Display", serif;
      font-size: 30px;
    }

    .message {
      min-height: 22px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    .message.error {
      color: #a5362e;
      font-weight: 700;
    }

    .dashboard {
      display: none;
    }

    .dashboard.visible {
      display: block;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      min-height: 100px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 16px;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .stat strong {
      display: block;
      margin-top: 10px;
      font-size: 32px;
    }

    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2 {
      margin: 0;
      font-size: 16px;
    }

    .search {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px 12px;
      background: #fff;
      color: var(--ink);
    }

    .stores {
      max-height: 660px;
      overflow: auto;
    }

    .store-row {
      width: 100%;
      display: block;
      border: 0;
      border-bottom: 1px solid var(--line);
      padding: 13px 16px;
      background: #fff;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .store-row.active {
      background: #f7eee7;
      border-left: 4px solid var(--accent);
    }

    .store-row strong {
      display: block;
      margin-bottom: 4px;
      font-size: 15px;
    }

    .store-row span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .table-wrap {
      width: 100%;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }

    th {
      background: #fbf3ec;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }

    .status {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 9px;
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      background: var(--amber);
    }

    .status.done {
      background: var(--green);
    }

    .empty {
      padding: 28px;
      color: var(--muted);
      text-align: center;
    }

    .link {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    @media (max-width: 840px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats,
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="gate" id="gate">
      <div class="gate-panel">
        <h2>Super Admin</h2>
        <p class="message" id="loginMessage"></p>
        <button class="button" id="signInBtn" type="button">Sign in with Google</button>
      </div>
    </section>

    <section class="dashboard" id="dashboard">
      <div class="topbar">
        <div>
          <h1>Super Admin</h1>
          <div class="user-line" id="userLine"></div>
        </div>
        <button class="button secondary" id="signOutBtn" type="button">Sign Out</button>
      </div>

      <div class="stats">
        <div class="stat"><span>Stores</span><strong id="storesCount">0</strong></div>
        <div class="stat"><span>Orders</span><strong id="ordersCount">0</strong></div>
        <div class="stat"><span>Pending</span><strong id="pendingCount">0</strong></div>
        <div class="stat"><span>Done</span><strong id="doneCount">0</strong></div>
      </div>

      <div class="layout">
        <section class="panel">
          <div class="panel-head">
            <h2>Stores</h2>
          </div>
          <div style="padding: 12px 16px; border-bottom: 1px solid var(--line);">
            <input class="search" id="storeSearch" type="search" placeholder="Search stores" />
          </div>
          <div class="stores" id="storesList"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2 id="ordersTitle">All Orders</h2>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Store</th>
                  <th>Customer</th>
                  <th>Phone</th>
                  <th>Link</th>
                  <th>Status</th>
                  <th>Submitted</th>
                  <th>Time</th>
                </tr>
              </thead>
              <tbody id="ordersBody"></tbody>
            </table>
          </div>
          <div class="empty" id="emptyState" style="display:none">No orders found.</div>
        </section>
      </div>
    </section>
  </main>

  <script src="assets/js/firebase-orders.js"></script>
  <script>
    const gate = document.getElementById('gate');
    const dashboard = document.getElementById('dashboard');
    const loginMessage = document.getElementById('loginMessage');
    const signInBtn = document.getElementById('signInBtn');
    const signOutBtn = document.getElementById('signOutBtn');
    const userLine = document.getElementById('userLine');
    const storesCount = document.getElementById('storesCount');
    const ordersCount = document.getElementById('ordersCount');
    const pendingCount = document.getElementById('pendingCount');
    const doneCount = document.getElementById('doneCount');
    const storesList = document.getElementById('storesList');
    const ordersBody = document.getElementById('ordersBody');
    const emptyState = document.getElementById('emptyState');
    const ordersTitle = document.getElementById('ordersTitle');
    const storeSearch = document.getElementById('storeSearch');

    let firebaseApi = null;
    let stores = [];
    let orders = [];
    let selectedStoreId = null;
    let unsubscribeStores = null;
    let unsubscribeOrders = null;

    function setMessage(text, isError = false) {
      loginMessage.textContent = text || '';
      loginMessage.classList.toggle('error', isError);
    }

    function formatDate(value) {
      if (!value) return '';
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? value : date.toLocaleString();
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[char]));
    }

    function getStoreLabel(storeId) {
      const store = stores.find(item => item.id === storeId);
      return store?.displayName || store?.slug || storeId || '';
    }

    function getFilteredStores() {
      const term = storeSearch.value.trim().toLowerCase();
      if (!term) return stores;
      return stores.filter(store => {
        const haystack = [
          store.id,
          store.slug,
          store.displayName,
          store.ownerEmail,
        ].join(' ').toLowerCase();
        return haystack.includes(term);
      });
    }

    function getVisibleOrders() {
      return selectedStoreId
        ? orders.filter(order => order.storeId === selectedStoreId)
        : orders;
    }

    function renderStats() {
      storesCount.textContent = stores.length;
      ordersCount.textContent = orders.length;
      pendingCount.textContent = orders.filter(order => order.status !== 'done').length;
      doneCount.textContent = orders.filter(order => order.status === 'done').length;
    }

    function renderStores() {
      const rows = getFilteredStores();
      storesList.innerHTML = '';

      const allButton = document.createElement('button');
      allButton.className = `store-row ${selectedStoreId ? '' : 'active'}`;
      allButton.type = 'button';
      allButton.innerHTML = `<strong>All stores</strong><span>${orders.length} orders</span>`;
      allButton.addEventListener('click', () => {
        selectedStoreId = null;
        renderAll();
      });
      storesList.appendChild(allButton);

      rows.forEach(store => {
        const count = orders.filter(order => order.storeId === store.id).length;
        const button = document.createElement('button');
        button.className = `store-row ${selectedStoreId === store.id ? 'active' : ''}`;
        button.type = 'button';
        button.innerHTML = `
          <strong>${escapeHtml(store.displayName || store.id)}</strong>
          <span>${escapeHtml(store.id)}</span>
          <span>${escapeHtml(store.ownerEmail || 'No owner email')} · ${count} orders</span>
        `;
        button.addEventListener('click', () => {
          selectedStoreId = store.id;
          renderAll();
        });
        storesList.appendChild(button);
      });
    }

    function renderOrders() {
      const visibleOrders = getVisibleOrders();
      ordersTitle.textContent = selectedStoreId
        ? `${getStoreLabel(selectedStoreId)} Orders`
        : 'All Orders';
      emptyState.style.display = visibleOrders.length ? 'none' : '';
      ordersBody.innerHTML = visibleOrders.map(order => `
        <tr>
          <td>${escapeHtml(getStoreLabel(order.storeId))}</td>
          <td>${escapeHtml(order.name || '')}</td>
          <td>${escapeHtml(order.phone || '')}</td>
          <td><a class="link" href="${escapeHtml(order.link)}" target="_blank" rel="noopener">Open</a></td>
          <td><span class="status ${order.status === 'done' ? 'done' : ''}">${order.status || 'pending'}</span></td>
          <td>${escapeHtml(order.submittedByName || '')}</td>
          <td>${escapeHtml(formatDate(order.time))}</td>
        </tr>
      `).join('');
    }

    function renderAll() {
      renderStats();
      renderStores();
      renderOrders();
    }

    function closeSubscriptions() {
      if (unsubscribeStores) unsubscribeStores();
      if (unsubscribeOrders) unsubscribeOrders();
      unsubscribeStores = null;
      unsubscribeOrders = null;
    }

    function showGate(message = '', isError = false) {
      closeSubscriptions();
      gate.style.display = 'grid';
      dashboard.classList.remove('visible');
      setMessage(message, isError);
    }

    function showDashboard(user) {
      gate.style.display = 'none';
      dashboard.classList.add('visible');
      userLine.textContent = user.email;

      unsubscribeStores = firebaseApi.subscribeToStores((items) => {
        stores = items.sort((a, b) => String(a.displayName || a.id).localeCompare(String(b.displayName || b.id)));
        renderAll();
      }, (error) => {
        console.error('Could not load stores:', error);
        showGate('Could not load stores. Check Firestore rules.', true);
      });

      unsubscribeOrders = firebaseApi.subscribeToAllOrders((items) => {
        orders = items;
        renderAll();
      }, (error) => {
        console.error('Could not load all orders:', error);
        showGate('Could not load orders. Check Firestore rules.', true);
      });
    }

    signInBtn.addEventListener('click', async () => {
      signInBtn.disabled = true;
      setMessage('Opening Google sign-in...');
      try {
        await firebaseApi.signInWithGoogle();
      } catch (error) {
        console.error('Super admin sign-in failed:', error);
        setMessage('Google sign-in failed.', true);
      } finally {
        signInBtn.disabled = false;
      }
    });

    signOutBtn.addEventListener('click', () => {
      firebaseApi.signOutAdmin();
    });

    storeSearch.addEventListener('input', renderStores);

    window.LamarFirebaseReady
      .then(api => {
        firebaseApi = api;
        api.onAdminAuthStateChanged(user => {
          if (!user) {
            showGate();
            return;
          }

          if (!api.isSuperAdminUser(user)) {
            showGate(`Access denied for ${user.email}.`, true);
            return;
          }

          showDashboard(user);
        });
      })
      .catch(error => {
        console.error('Firebase setup failed:', error);
        showGate('Firebase could not load.', true);
      });
  </script>
</body>
</html>
