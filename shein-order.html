<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHEIN Order – Lamar</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet" />
  <style>
    html, body { overflow: hidden; height: 100%; }
    .order-page {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      background: var(--bg);
      overflow: hidden;
    }
    .order-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 48px 40px;
      width: 100%;
      max-width: 480px;
    }
    .card-header-area {
      position: relative;
      height: 264px;
      margin-bottom: 28px;
    }
    .card-default-header {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      opacity: 1;
      transition: opacity .4s ease;
    }
    .card-default-header.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .order-card-icon {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
      color: var(--navy);
    }
    .order-card h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--navy);
      text-align: center;
      margin-bottom: 8px;
    }
    .order-card p {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 0;
    }
    .fadwa-greeting {
      margin-top: 12px;
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #ad1457;
      letter-spacing: .3px;
    }
    .fadwa-reveal {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(.85);
      transition: opacity .6s ease, transform .6s ease;
      pointer-events: none;
    }
    .fadwa-reveal.visible {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }
    .fadwa-reveal img {
      width: 220px;
      height: 220px;
      object-fit: cover;
      object-position: center;
      border-radius: 50%;
      box-shadow: 0 12px 40px rgba(0,0,0,.18), 0 0 0 4px rgba(249,168,212,.35);
    }
    .order-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 20px;
    }
    .order-field label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: .3px;
    }
    .order-field input {
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color .25s ease;
    }
    .order-field input:focus { border-color: var(--navy); }
    .order-field input::placeholder { color: var(--text-light); }
    @media (max-width: 768px) {
      input, textarea, select { font-size: 16px !important; }
    }
    .order-submit {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      background: var(--navy);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .5px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      transition: background .25s ease;
    }
    .order-submit:hover { background: var(--gold); }
    .admin-link {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-top: 12px;
      font-size: 12px;
      font-weight: 600;
      color: #8b5cf6;
      text-decoration: none;
      letter-spacing: .3px;
      transition: opacity .2s;
    }
    .admin-link:hover { opacity: .7; }
    .admin-link.visible { display: flex; }
    .not-you-link {
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      transition: color .2s;
      display: inline-block;
      margin-top: 10px;
    }
    .not-you-link:hover { color: var(--navy); }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
      transition: color .25s ease;
    }
    .back-link:hover { color: var(--navy); }

    /* ── LANGUAGE SWITCHER ── */
    .lang-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 14px;
    }
    .lang-switcher {
      display: flex;
      gap: 2px;
      background: var(--bg);
      border-radius: 20px;
      padding: 2px;
      border: 1.5px solid var(--border);
    }
    .lang-btn {
      padding: 3px 10px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      transition: all .2s;
      letter-spacing: .3px;
      cursor: pointer;
      background: none;
      border: none;
    }
    .lang-btn.active {
      background: var(--navy);
      color: #fff;
    }

    /* ── RTL ── */
    [dir="rtl"] .order-card { text-align: right; }
    [dir="rtl"] .back-link { flex-direction: row-reverse; }
    [dir="rtl"] .admin-link { flex-direction: row-reverse; }
    [dir="rtl"] .lang-bar { justify-content: flex-start; }

    @media (max-width: 480px) {
      .order-card { padding: 24px 20px; }
      .order-card h1 { font-size: 20px; }
      .card-header-area { height: 200px; margin-bottom: 16px; }
      .fadwa-reveal img { width: 170px; height: 170px; }
      .order-field { margin-bottom: 14px; }
      .back-link { margin-top: 14px; }
    }
  </style>
</head>
<body>
  <div class="order-page">
    <div class="order-card">

      <!-- Language Switcher -->
      <div class="lang-bar">
        <div class="lang-switcher">
          <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
          <button class="lang-btn" data-lang="fr" onclick="setLang('fr')">FR</button>
          <button class="lang-btn" data-lang="ar" onclick="setLang('ar')">ع</button>
        </div>
      </div>

      <div class="card-header-area">
        <div class="fadwa-reveal" id="fadwaReveal">
          <img src="assets/images/order/shein-by-fadwa.png" alt="SHEIN By Fadwa" />
          <p class="fadwa-greeting">Hii Girls🎀</p>
        </div>
        <div class="card-default-header" id="cardDefaultHeader">
          <div class="order-card-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </div>
          <h1 id="headerTitle">Welcome</h1>
          <p id="headerDesc">Enter your details once to get started.</p>
        </div>
      </div>

      <!-- Step 0: Profile setup (shown only on first visit) -->
      <div id="step0" style="display:none">
        <div class="order-field">
          <label for="profileName" data-i18n="your_name">Your Name</label>
          <input type="text" id="profileName" placeholder="e.g. Sara" data-i18n-ph="your_name_ph" autocomplete="name" />
        </div>
        <div class="order-field">
          <label for="profilePhone" data-i18n="phone">Phone Number</label>
          <input type="tel" id="profilePhone" placeholder="e.g. +212 6XX XXX XXX" data-i18n-ph="phone_ph" autocomplete="tel" />
        </div>
        <button class="order-submit" data-i18n="continue_btn" onclick="saveProfile()">Continue</button>
      </div>

      <!-- Step 1: Order form (shown on every visit once profile is saved) -->
      <div id="step1" style="display:none">
        <div class="order-field">
          <label for="orderName" data-i18n="customer_name">Customer Name</label>
          <input type="text" id="orderName" placeholder="e.g. Sara" data-i18n-ph="customer_name_ph" autocomplete="name" />
        </div>
        <div class="order-field">
          <label for="orderLink" data-i18n="product_link">SHEIN Product Link</label>
          <input type="url" id="orderLink" placeholder="https://www.shein.com/…" data-i18n-ph="product_link_ph" autocomplete="off" />
        </div>
        <button class="order-submit" id="submitBtn" data-i18n="submit" onclick="submitOrder()">Submit Order</button>
        <div style="text-align:center">
          <span class="not-you-link" id="notYouLink" onclick="clearProfile()"></span>
        </div>
      </div>

      <a href="admin.html" class="admin-link" id="adminLink">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span data-i18n="admin_dashboard">Admin Dashboard</span>
      </a>
    </div>

    <a href="index.html" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="m12 5-7 7 7 7"/></svg>
      <span data-i18n="back_to_lamar">Back to Lamar</span>
    </a>
  </div>

  <script src="assets/js/firebase-orders.js"></script>
  <script>
    const PROFILE_KEY = window.LamarStore
      ? `lamar_profile_${window.LamarStore.slug}`
      : 'lamar_profile';
    const reveal = document.getElementById('fadwaReveal');
    const defaultHeader = document.getElementById('cardDefaultHeader');
    const adminLink = document.getElementById('adminLink');
    const headerTitle = document.getElementById('headerTitle');
    const headerDesc = document.getElementById('headerDesc');

    /* ── I18N ── */
    const LANGS = {
      en: {
        welcome:          'Welcome',
        welcome_desc:     'Enter your details once to get started.',
        your_name:        'Your Name',
        your_name_ph:     'e.g. Sara',
        phone:            'Phone Number',
        phone_ph:         'e.g. +212 6XX XXX XXX',
        continue_btn:     'Continue',
        order_title:      'SHEIN Order',
        order_desc:       name => `Hi ${name}! Paste the SHEIN product link below.`,
        customer_name:    'Customer Name',
        customer_name_ph: 'e.g. Sara',
        product_link:     'SHEIN Product Link',
        product_link_ph:  'https://www.shein.com/…',
        submit:           'Submit Order',
        not_you:          name => `Not ${name}? Change`,
        order_sent:       'Order Sent ✓',
        back_to_lamar:    'Back to Lamar',
        admin_dashboard:  'Admin Dashboard',
      },
      fr: {
        welcome:          'Bienvenue',
        welcome_desc:     'Entrez vos informations une seule fois pour commencer.',
        your_name:        'Votre Nom',
        your_name_ph:     'ex. Sara',
        phone:            'Numéro de téléphone',
        phone_ph:         'ex. +212 6XX XXX XXX',
        continue_btn:     'Continuer',
        order_title:      'Commande SHEIN',
        order_desc:       name => `Salut ${name} ! Collez le lien produit SHEIN ci-dessous.`,
        customer_name:    'Nom du client',
        customer_name_ph: 'ex. Sara',
        product_link:     'Lien du produit SHEIN',
        product_link_ph:  'https://www.shein.com/…',
        submit:           'Envoyer la commande',
        not_you:          name => `Pas ${name} ? Changer`,
        order_sent:       'Commande envoyée ✓',
        back_to_lamar:    'Retour à Lamar',
        admin_dashboard:  'Tableau de bord admin',
      },
      ar: {
        welcome:          'أهلاً',
        welcome_desc:     'أدخل بياناتك مرة واحدة للبدء.',
        your_name:        'اسمك',
        your_name_ph:     'مثال: سارة',
        phone:            'رقم الهاتف',
        phone_ph:         'مثال: +212 6XX XXX XXX',
        continue_btn:     'متابعة',
        order_title:      'طلب SHEIN',
        order_desc:       name => `مرحباً ${name}! الصقي رابط المنتج أدناه.`,
        customer_name:    'اسم العميل',
        customer_name_ph: 'مثال: سارة',
        product_link:     'رابط المنتج',
        product_link_ph:  'https://www.shein.com/…',
        submit:           'إرسال الطلب',
        not_you:          name => `لست ${name}؟ تغيير`,
        order_sent:       'تم الإرسال ✓',
        back_to_lamar:    'العودة إلى Lamar',
        admin_dashboard:  'لوحة التحكم',
      },
    };

    let currentLang = localStorage.getItem('lamar_lang') || 'en';

    function t(key) {
      const val = (LANGS[currentLang] && LANGS[currentLang][key] !== undefined)
        ? LANGS[currentLang][key]
        : (LANGS.en[key] !== undefined ? LANGS.en[key] : key);
      return val;
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('lamar_lang', lang);
      applyTranslations();
    }

    function applyTranslations() {
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';

      document.querySelectorAll('.lang-btn').forEach(btn =>
        btn.classList.toggle('active', btn.dataset.lang === currentLang));

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const v = t(el.dataset.i18n);
        if (typeof v === 'string') el.textContent = v;
      });

      document.querySelectorAll('[data-i18n-ph]').forEach(el => {
        const v = t(el.dataset.i18nPh);
        if (typeof v === 'string') el.placeholder = v;
      });

      const profile = JSON.parse(localStorage.getItem(PROFILE_KEY) || 'null');
      if (document.getElementById('step1').style.display !== 'none' && profile) {
        headerTitle.textContent = t('order_title');
        const descFn = t('order_desc');
        headerDesc.textContent = typeof descFn === 'function' ? descFn(profile.name) : descFn;
        const notYouFn = t('not_you');
        document.getElementById('notYouLink').textContent =
          typeof notYouFn === 'function' ? notYouFn(profile.name) : notYouFn;
      } else {
        headerTitle.textContent = t('welcome');
        headerDesc.textContent = t('welcome_desc');
      }
    }

    function isFadwaName(name) {
      return name.trim().toLowerCase() === 'fadwa.hn';
    }

    function showStep0() {
      document.getElementById('step0').style.display = '';
      document.getElementById('step1').style.display = 'none';
      reveal.classList.remove('visible');
      defaultHeader.classList.remove('hidden');
      adminLink.classList.remove('visible');
      headerTitle.textContent = t('welcome');
      headerDesc.textContent = t('welcome_desc');
      setTimeout(() => document.getElementById('profileName').focus(), 50);
    }

    function showStep1(profile) {
      document.getElementById('step0').style.display = 'none';
      document.getElementById('step1').style.display = '';
      document.getElementById('orderName').value = '';
      const notYouFn = t('not_you');
      document.getElementById('notYouLink').textContent =
        typeof notYouFn === 'function' ? notYouFn(profile.name) : notYouFn;
      headerTitle.textContent = t('order_title');
      const descFn = t('order_desc');
      headerDesc.textContent = typeof descFn === 'function' ? descFn(profile.name) : descFn;
      reveal.classList.remove('visible');
      defaultHeader.classList.remove('hidden');
      adminLink.classList.remove('visible');
    }

    document.getElementById('orderName').addEventListener('input', () => {
      const isFadwa = isFadwaName(document.getElementById('orderName').value);
      reveal.classList.toggle('visible', isFadwa);
      defaultHeader.classList.toggle('hidden', isFadwa);
      adminLink.classList.toggle('visible', isFadwa);
    });

    function saveProfile() {
      const name = document.getElementById('profileName').value.trim();
      const phone = document.getElementById('profilePhone').value.trim();
      if (!name) { document.getElementById('profileName').focus(); return; }
      if (!phone) { document.getElementById('profilePhone').focus(); return; }
      localStorage.setItem(PROFILE_KEY, JSON.stringify({ name, phone }));
      showStep1({ name, phone });
      setTimeout(() => document.getElementById('orderLink').focus(), 50);
    }

    function clearProfile() {
      localStorage.removeItem(PROFILE_KEY);
      document.getElementById('profileName').value = '';
      document.getElementById('profilePhone').value = '';
      showStep0();
    }

    function getFirebaseOrdersApi() {
      if (!window.LamarFirebaseReady) {
        return Promise.reject(new Error('Firebase is not available.'));
      }

      return window.LamarFirebaseReady;
    }

    async function submitOrder() {
      const profile = JSON.parse(localStorage.getItem(PROFILE_KEY) || 'null');
      const customerName = document.getElementById('orderName').value.trim();
      const link = document.getElementById('orderLink').value.trim();
      if (!customerName) { document.getElementById('orderName').focus(); return; }
      if (!link) { document.getElementById('orderLink').focus(); return; }
      if (!profile) { showStep0(); return; }

      const btn = document.getElementById('submitBtn');
      const originalText = btn.textContent;
      btn.disabled = true;

      try {
        const api = await getFirebaseOrdersApi();
        await api.createOrder({
          name: customerName,
          phone: profile.phone,
          link,
          submittedByName: profile.name,
        });

        document.getElementById('orderLink').value = '';
        document.getElementById('orderName').value = '';
        localStorage.removeItem(PROFILE_KEY);
        btn.textContent = t('order_sent');
        btn.style.background = 'var(--green)';
        setTimeout(() => {
          btn.textContent = t('submit');
          btn.style.background = '';
          document.getElementById('profileName').value = '';
          document.getElementById('profilePhone').value = '';
          showStep0();
        }, 2200);
      } catch (error) {
        console.error('Order submission failed:', error);
        alert('Could not send the order. Please check that this store exists, then try again.');
        btn.textContent = originalText;
      } finally {
        btn.disabled = false;
      }
    }

    // Init
    (function init() {
      applyTranslations();
      const profile = JSON.parse(localStorage.getItem(PROFILE_KEY) || 'null');
      if (profile && profile.name && profile.phone) {
        showStep1(profile);
      } else {
        showStep0();
      }

      getFirebaseOrdersApi()
        .then(api => api.migrateLegacyOrdersIfNeeded())
        .catch(error => console.warn('Legacy Firestore migration skipped:', error));
    })();
  </script>
</body>
</html>
